name: CI
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.13", "3.14"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - uses: actions/setup-node@v4
        with:
          node-version: 24 # the Replay-HTML player test executes the embedded JavaScript with node
      - run: python -m pip install -e "backend[dev]"
      - run: python -m ruff check backend scripts
      - run: python scripts/gen_types.py --check
      - run: python -m pytest backend/tests

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npx vitest run # live.test.ts / live5.test.ts skip themselves without GLASSBOX_LIVE
      - run: npm run build
